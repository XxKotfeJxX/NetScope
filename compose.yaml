name: netscope

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: netscope
      POSTGRES_USER: netscope
      POSTGRES_PASSWORD: netscope
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscope -d netscope"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - netscope_postgres:/var/lib/postgresql

  api:
    profiles: ["full"]
    build:
      context: .
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0-dev
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://netscope:netscope@postgres:5432/netscope?sslmode=disable
      NETWORK_POLICY: local
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  netscope_postgres:
