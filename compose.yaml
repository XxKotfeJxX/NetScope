name: netscope

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: netscope
      POSTGRES_USER: netscope
      POSTGRES_PASSWORD: netscope
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscope -d netscope"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - netscope_postgres:/var/lib/postgresql

  api:
    profiles: ["full"]
    build:
      context: .
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-0.4.0-dev}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://netscope:netscope@postgres:5432/netscope?sslmode=disable
      NETWORK_POLICY: local
      ICMP_ENABLED: "true"
      MONITORING_POLL_INTERVAL: 10s
      NOTIFICATION_TIMEOUT: ${NOTIFICATION_TIMEOUT:-10s}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SESSION_TTL: ${SESSION_TTL:-720h}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_FORMAT: json
    cap_add:
      - NET_RAW
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  netscope_postgres:
