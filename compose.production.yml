name: netscope

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netscope
      POSTGRES_USER: netscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netscope -d netscope"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - netscope_postgres:/var/lib/postgresql
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      WEB_ORIGIN: https://${NETSCOPE_DOMAIN:?Set NETSCOPE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      NETWORK_POLICY: public
      ALLOW_LOOPBACK_TARGETS: "false"
      ALLOW_PRIVATE_TARGETS: "false"
      ALLOW_LINK_LOCAL_TARGETS: "false"
      ICMP_ENABLED: ${ICMP_ENABLED:-true}
      MONITORING_POLL_INTERVAL: ${MONITORING_POLL_INTERVAL:-10s}
      NOTIFICATION_TIMEOUT: ${NOTIFICATION_TIMEOUT:-10s}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SESSION_TTL: ${SESSION_TTL:-720h}
      SESSION_COOKIE_SECURE: "true"
      CSRF_PROTECTION_ENABLED: "true"
      # Safe here because the API is reachable only through the bundled Caddy proxy.
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-300}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_MUTATION: ${RATE_LIMIT_MUTATION:-60}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, diagnostics]
    logging: *logging

  web:
    build:
      context: web
    restart: unless-stopped
    environment:
      NETSCOPE_DOMAIN: ${NETSCOPE_DOMAIN:?Set NETSCOPE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, backend]
    logging: *logging

networks:
  edge:
  diagnostics:
  backend:
    internal: true

volumes:
  netscope_postgres:
  caddy_data:
  caddy_config:
