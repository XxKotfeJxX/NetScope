name: integration

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/storage/postgres/migrations/**"
      - ".github/workflows/integration.yml"
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: netscope_test
          POSTGRES_USER: netscope
          POSTGRES_PASSWORD: netscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netscope -d netscope_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://netscope:netscope@localhost:5432/netscope_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Repository and migration tests
        run: go test -tags=integration ./internal/storage/postgres

