openapi: 3.1.0
info:
  title: NetScope API
  version: 1.0.0
  description: |
    Stable v1 API for concurrent network diagnostics, scheduled monitoring,
    workspace collaboration, and published read-only reports.

    Requests are subject to per-client fixed-window limits. Successful and
    rejected responses expose RateLimit-Limit, RateLimit-Remaining, and
    RateLimit-Reset. HTTP 429 responses also expose Retry-After.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: System
    description: Health, readiness, and runtime capabilities.
  - name: Runs
    description: Diagnostic run lifecycle, results, events, and exports.
  - name: Monitoring
    description: Saved targets, schedules, history, maintenance, and notifications.
  - name: Identity
    description: Account registration, sessions, and current-user context.
  - name: Workspaces
    description: Collaborative workspace lifecycle and membership context.
  - name: Reports
    description: Team comments and controlled public diagnostic evidence.
security:
  - sessionCookie: []
  - bearerSession: []
paths:
  /healthz:
    get:
      security: []
      tags: [System]
      operationId: getHealth
      summary: Check whether the API process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      security: []
      tags: [System]
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      responses:
        "200":
          description: API is ready
        "503":
          description: PostgreSQL is unavailable
  /api/v1/capabilities:
    get:
      security: []
      tags: [System]
      operationId: getCapabilities
      summary: Get available diagnostic checks and runtime limits
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/v1/auth/register:
    post:
      security: []
      tags: [Identity]
      operationId: registerAccount
      summary: Register an account and its first workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account and session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      security: []
      tags: [Identity]
      operationId: loginAccount
      summary: Create a user session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      security: []
      tags: [Identity]
      operationId: logoutAccount
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentAccount
      summary: Get the current user and workspace context
      security:
        - sessionCookie: []
        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces for the current user
      security:
        - sessionCookie: []
        - bearerSession: []
      responses:
        "200":
          description: Workspace memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace owned by the current user
      security:
        - sessionCookie: []
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/workspace/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceHeader"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List members of the active workspace
      responses:
        "200":
          description: Workspace members ordered by privilege and name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Add a registered account to the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMember"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceHeader"
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceMemberRole
      summary: Change a workspace member role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove an account from the active workspace
      responses:
        "204":
          description: Member removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace/audit:
    get:
      tags: [Workspaces]
      operationId: listWorkspaceAudit
      summary: List immutable workspace control-plane events
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspace/api-keys:
    parameters:
      - $ref: "#/components/parameters/WorkspaceHeader"
    get:
      tags: [Workspaces]
      operationId: listWorkspaceAPIKeys
      summary: List API key metadata for the active workspace
      responses:
        "200":
          description: API keys, including expired and revoked entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Workspaces]
      operationId: createWorkspaceAPIKey
      summary: Create a scoped API key and reveal its secret once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKey"
      responses:
        "201":
          description: API key created; the token cannot be retrieved again
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspace/api-keys/{keyID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceHeader"
      - name: keyID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceAPIKey
      summary: Permanently revoke an active API key
      responses:
        "204":
          description: API key revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/WorkspaceHeader"
    get:
      tags: [Reports]
      operationId: listRunComments
      summary: List internal workspace comments for a diagnostic report
      responses:
        "200":
          description: Ordered report comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportComment"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Reports]
      operationId: createRunComment
      summary: Add an internal comment to a diagnostic report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Comment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/comments/{commentID}:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/WorkspaceHeader"
      - name: commentID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Reports]
      operationId: deleteRunComment
      summary: Delete an owned comment or moderate it as an Admin
      responses:
        "204":
          description: Comment deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/public-links:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/WorkspaceHeader"
    get:
      tags: [Reports]
      operationId: listPublicReportLinks
      summary: List public-link metadata for a diagnostic report
      responses:
        "200":
          description: Public links without recoverable secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicReportLink"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Reports]
      operationId: createPublicReportLink
      summary: Publish a read-only report link and reveal its token once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt:
                  type: string
                  format: date-time
                  description: Defaults to 30 days and cannot exceed 365 days.
      responses:
        "201":
          description: Public report link created
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPublicReportLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/public-links/{linkID}:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - $ref: "#/components/parameters/WorkspaceHeader"
      - name: linkID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Reports]
      operationId: revokePublicReportLink
      summary: Revoke an active public report link
      responses:
        "204":
          description: Link revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/public/reports/{token}:
    get:
      security: []
      tags: [Reports]
      operationId: getPublicReport
      summary: Resolve a published read-only diagnostic report
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published diagnostic evidence
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReport"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Queue a diagnostic run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run queued
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Target blocked by network policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Run queue or database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List persisted diagnostic runs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Run history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
  /api/v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a diagnostic run and its results
      responses:
        "200":
          description: Diagnostic run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a queued or active run
      responses:
        "204":
          description: Cancellation accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run has already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream live run progress
      description: |
        Server-Sent Events stream. Event names are `run.started`,
        `check.started`, `check.completed`, `check.failed`, `run.completed`,
        and `run.cancelled`. REST and PostgreSQL remain the source of truth.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/export:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - in: query
        name: format
        schema:
          type: string
          enum: [json, csv]
          default: json
    get:
      tags: [Runs]
      operationId: exportRun
      summary: Export a run as JSON or CSV
      responses:
        "200":
          description: JSON export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRun"
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets:
    get:
      tags: [Monitoring]
      operationId: listTargets
      summary: List monitored targets
      responses:
        "200":
          description: Monitored target page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetPage"
    post:
      tags: [Monitoring]
      operationId: createTarget
      summary: Save and schedule a monitored target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/targets/{targetID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: getTarget
      summary: Get a monitored target
      responses:
        "200":
          description: Monitored target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Monitoring]
      operationId: updateTarget
      summary: Update target configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "200":
          description: Updated target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Monitoring]
      operationId: deleteTarget
      summary: Delete a monitored target and its history
      responses:
        "204":
          description: Target deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/pause:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      tags: [Monitoring]
      operationId: pauseTarget
      summary: Pause scheduled checks
      responses:
        "204":
          description: Target paused
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/resume:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      tags: [Monitoring]
      operationId: resumeTarget
      summary: Resume scheduled checks
      responses:
        "204":
          description: Target resumed and due immediately
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/checks:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listTargetChecks
      summary: List target status and latency history
      responses:
        "200":
          description: Monitoring check page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringCheckPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/maintenance:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listMaintenanceWindows
      summary: List target maintenance windows
      responses:
        "200":
          description: Maintenance windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceWindow"
    post:
      tags: [Monitoring]
      operationId: createMaintenanceWindow
      summary: Schedule a maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowInput"
      responses:
        "201":
          description: Maintenance window created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/targets/{targetID}/maintenance/{windowID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/WindowID"
    delete:
      tags: [Monitoring]
      operationId: deleteMaintenanceWindow
      summary: Delete a maintenance window
      responses:
        "204":
          description: Maintenance window deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/notifications:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listNotificationChannels
      summary: List target notification channels
      responses:
        "200":
          description: Notification channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
    post:
      tags: [Monitoring]
      operationId: createNotificationChannel
      summary: Add an email or webhook channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelInput"
      responses:
        "201":
          description: Notification channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/targets/{targetID}/notifications/{channelID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/ChannelID"
    delete:
      tags: [Monitoring]
      operationId: deleteNotificationChannel
      summary: Delete a notification channel
      responses:
        "204":
          description: Notification channel deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/monitoring:
    get:
      tags: [Monitoring]
      operationId: getMonitoringOverview
      summary: Get active-target counts and the operational journal
      responses:
        "200":
          description: Monitoring overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringOverview"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: netscope_session
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: ns_session_* or ns_key_*
      description: Opaque user session or workspace-scoped API key.
  parameters:
    WorkspaceHeader:
      in: header
      name: X-Workspace-ID
      required: false
      description: Active workspace. Defaults to the first available membership.
      schema:
        type: string
        format: uuid
    RunID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    TargetID:
      in: path
      name: targetID
      required: true
      schema:
        type: string
        format: uuid
    WindowID:
      in: path
      name: windowID
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      in: path
      name: channelID
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Invalid target, options, or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Diagnostic run not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the session is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The active workspace role does not permit this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested change conflicts with workspace state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The active client rate limit was exceeded
      headers:
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema:
            type: integer
        Retry-After:
          description: Seconds until the request may be retried.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Role:
      type: string
      enum: [owner, admin, operator, viewer]
    User:
      type: object
      required: [id, email, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Workspace:
      type: object
      required: [id, name, slug, role, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceMember:
      type: object
      required: [userId, email, displayName, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    AddWorkspaceMember:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
    AuditEvent:
      type: object
      required:
        [id, workspaceId, actorUserId, action, resourceType, metadata, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    APIKey:
      type: object
      required:
        [id, workspaceId, name, prefix, role, createdBy, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum: [operator, viewer]
        createdBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateAPIKey:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [operator, viewer]
        expiresAt:
          type: string
          format: date-time
          description: Defaults to 90 days and cannot exceed 365 days.
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              writeOnly: true
              description: Plaintext credential returned exactly once.
    ReportComment:
      type: object
      required:
        - id
        - workspaceId
        - runId
        - authorId
        - authorName
        - authorEmail
        - body
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorName:
          type: string
        authorEmail:
          type: string
          format: email
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicReportLink:
      type: object
      required:
        [id, workspaceId, runId, tokenPrefix, createdBy, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        tokenPrefix:
          type: string
        createdBy:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastViewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedPublicReportLink:
      allOf:
        - $ref: "#/components/schemas/PublicReportLink"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              writeOnly: true
              description: Secret URL token returned exactly once.
    PublicReport:
      type: object
      required: [workspaceName, publishedAt, expiresAt, run]
      properties:
        workspaceName:
          type: string
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        run:
          $ref: "#/components/schemas/DiagnosticRun"
    RegistrationInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        workspaceName:
          type: string
          minLength: 1
          maxLength: 100
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CurrentAccount:
      type: object
      required: [user, workspaces, activeWorkspace, sessionExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        activeWorkspace:
          $ref: "#/components/schemas/Workspace"
        sessionExpiresAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: netscope
        version:
          type: string
    Capability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
    Capabilities:
      type: object
      required: [version, checks, runtime]
      properties:
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Capability"
        runtime:
          type: object
          required:
            [
              defaultTimeoutMs,
              maxTimeoutMs,
              runWorkers,
              probeConcurrency,
              networkPolicy,
            ]
          properties:
            defaultTimeoutMs:
              type: integer
            maxTimeoutMs:
              type: integer
            runWorkers:
              type: integer
            probeConcurrency:
              type: integer
            networkPolicy:
              type: string
              enum: [local, public]
    CheckType:
      type: string
      enum: [dns, tcp, http, tls, ping, traceroute]
    RunStatus:
      type: string
      enum:
        [queued, running, completed, partial, failed, cancelled, interrupted]
    CheckStatus:
      type: string
      enum: [pending, running, passed, warning, failed, skipped, cancelled]
    RunOptions:
      type: object
      required:
        [
          timeoutMs,
          httpMethod,
          followRedirects,
          maxRedirects,
          ipVersion,
          pingPackets,
          maxHops,
        ]
      properties:
        timeoutMs:
          type: integer
          minimum: 500
          maximum: 30000
          default: 5000
        tcpPorts:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
        httpMethod:
          type: string
          enum: [GET, HEAD]
          default: GET
        followRedirects:
          type: boolean
          default: true
        maxRedirects:
          type: integer
          minimum: 0
          maximum: 10
          default: 5
        ipVersion:
          type: string
          enum: [auto, ipv4, ipv6]
          default: auto
        pingPackets:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
        maxHops:
          type: integer
          minimum: 1
          maximum: 64
          default: 20
    CreateRunRequest:
      type: object
      required: [target, checks]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 2048
          examples: [example.com, "https://example.com", 1.1.1.1]
        checks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
    CreateRunResponse:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        createdAt:
          type: string
          format: date-time
    CheckResult:
      type: object
      required:
        [id, runId, type, status, durationMs, data, startedAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/CheckType"
        status:
          $ref: "#/components/schemas/CheckStatus"
        durationMs:
          type: integer
          format: int64
        summary:
          type: string
        data:
          oneOf:
            - $ref: "#/components/schemas/DNSResult"
            - $ref: "#/components/schemas/TCPResult"
            - $ref: "#/components/schemas/HTTPResult"
            - $ref: "#/components/schemas/TLSResult"
            - $ref: "#/components/schemas/PingResult"
            - $ref: "#/components/schemas/TracerouteResult"
            - type: object
              additionalProperties: true
        errorCode:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    DNSResult:
      type: object
      required: [a, aaaa, mx, ns, txt, ptr]
      properties:
        a:
          type: array
          items:
            type: string
            format: ipv4
        aaaa:
          type: array
          items:
            type: string
            format: ipv6
        cname:
          type: string
        mx:
          type: array
          items:
            type: object
            required: [host, preference]
            properties:
              host:
                type: string
              preference:
                type: integer
        ns:
          type: array
          items:
            type: string
        txt:
          type: array
          items:
            type: string
        ptr:
          type: array
          items:
            type: string
        errors:
          type: object
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    TCPResult:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          items:
            type: object
            required: [port, status, connectTimeMs]
            properties:
              port:
                type: integer
                minimum: 1
                maximum: 65535
              status:
                type: string
                enum: [passed, failed, cancelled]
              resolvedIp:
                type: string
              connectTimeMs:
                type: integer
                format: int64
              errorCode:
                type: string
              errorMessage:
                type: string
    HTTPResult:
      type: object
      required: [requestedUrl, method, redirectChain, timings, bodyTruncated]
      properties:
        requestedUrl:
          type: string
          format: uri
        finalUrl:
          type: string
          format: uri
        method:
          type: string
        statusCode:
          type: integer
        protocol:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
        redirectChain:
          type: array
          items:
            type: object
            required: [url, statusCode]
            properties:
              url:
                type: string
                format: uri
              statusCode:
                type: integer
        resolvedIp:
          type: string
        remoteAddress:
          type: string
        timings:
          type: object
          required: [dnsMs, connectMs, tlsMs, ttfbMs, totalMs]
          properties:
            dnsMs:
              type: integer
            connectMs:
              type: integer
            tlsMs:
              type: integer
            ttfbMs:
              type: integer
            totalMs:
              type: integer
        bodySha256:
          type: string
        bodyPreview:
          type: string
        bodyTruncated:
          type: boolean
    TLSResult:
      type: object
      required:
        [
          serverName,
          sans,
          daysRemaining,
          hostnameValid,
          chainValid,
          selfSigned,
          expired,
          warnings,
        ]
      properties:
        tlsVersion:
          type: string
        cipherSuite:
          type: string
        serverName:
          type: string
        resolvedIp:
          type: string
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        sans:
          type: array
          items:
            type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        daysRemaining:
          type: integer
        hostnameValid:
          type: boolean
        chainValid:
          type: boolean
        selfSigned:
          type: boolean
        expired:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    PingResult:
      type: object
      required:
        [
          address,
          packetsSent,
          packetsReceived,
          packetLossPercent,
          minRttMs,
          averageRttMs,
          maxRttMs,
          samples,
        ]
      properties:
        address:
          type: string
        packetsSent:
          type: integer
        packetsReceived:
          type: integer
        packetLossPercent:
          type: number
          minimum: 0
          maximum: 100
        minRttMs:
          type: number
        averageRttMs:
          type: number
        maxRttMs:
          type: number
        samples:
          type: array
          items:
            type: object
            required: [sequence, status]
            properties:
              sequence:
                type: integer
              status:
                type: string
                enum: [received, timeout]
              address:
                type: string
              rttMs:
                type: number
    TracerouteResult:
      type: object
      required: [address, reached, maxHops, hops]
      properties:
        address:
          type: string
        reached:
          type: boolean
        maxHops:
          type: integer
        hops:
          type: array
          items:
            type: object
            required: [number, status, destination]
            properties:
              number:
                type: integer
              status:
                type: string
                enum: [replied, timeout]
              address:
                type: string
              rttMs:
                type: number
              destination:
                type: boolean
    DiagnosticRun:
      type: object
      required:
        [
          id,
          workspaceId,
          target,
          normalizedHost,
          status,
          checks,
          options,
          results,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        target:
          type: string
        normalizedHost:
          type: string
        normalizedUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/RunStatus"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
    RunPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRun"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    TargetStatus:
      type: string
      enum: [pending, operational, warning, unavailable, paused, maintenance]
    TargetInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 2048
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            maxLength: 32
        checks:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
        intervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
        failureThreshold:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    MonitoredTarget:
      allOf:
        - $ref: "#/components/schemas/TargetInput"
        - type: object
          required:
            [
              id,
              workspaceId,
              enabled,
              consecutiveFailures,
              status,
              nextCheckAt,
              createdAt,
              updatedAt,
            ]
          properties:
            id:
              type: string
              format: uuid
            workspaceId:
              type: string
              format: uuid
            enabled:
              type: boolean
            consecutiveFailures:
              type: integer
            status:
              $ref: "#/components/schemas/TargetStatus"
            lastCheckedAt:
              type: string
              format: date-time
            lastLatencyMs:
              type: integer
              format: int64
            tlsExpiresAt:
              type: string
              format: date-time
            nextCheckAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    TargetPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoredTarget"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    MonitoringCheck:
      type: object
      required: [id, targetId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TargetStatus"
        latencyMs:
          type: integer
          format: int64
        tlsExpiresAt:
          type: string
          format: date-time
        errorMessage:
          type: string
        checkedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MonitoringCheckPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringCheck"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    MaintenanceWindowInput:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
    MaintenanceWindow:
      allOf:
        - $ref: "#/components/schemas/MaintenanceWindowInput"
        - type: object
          required: [id, targetId, createdAt]
          properties:
            id:
              type: string
              format: uuid
            targetId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    NotificationChannelInput:
      type: object
      required: [kind, destination]
      properties:
        kind:
          type: string
          enum: [email, webhook]
        destination:
          type: string
    NotificationChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelInput"
        - type: object
          required: [id, targetId, enabled, createdAt]
          properties:
            id:
              type: string
              format: uuid
            targetId:
              type: string
              format: uuid
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
    MonitoringJournalEntry:
      allOf:
        - $ref: "#/components/schemas/MonitoringCheck"
        - type: object
          required: [targetName, targetAddress]
          properties:
            targetName:
              type: string
            targetAddress:
              type: string
    MonitoringOverview:
      type: object
      required:
        [activeTargets, warningTargets, unavailableTargets, recentChecks]
      properties:
        activeTargets:
          type: integer
          format: int64
        warningTargets:
          type: integer
          format: int64
        unavailableTargets:
          type: integer
          format: int64
        recentChecks:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringJournalEntry"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [invalid_target, run_not_found, target_blocked]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
