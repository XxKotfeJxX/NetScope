openapi: 3.1.0
info:
  title: NetScope API
  version: 0.3.0-dev
  description: Concurrent network diagnostics and scheduled monitoring API.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: System
    description: Health, readiness, and runtime capabilities.
  - name: Runs
    description: Diagnostic run lifecycle, results, events, and exports.
  - name: Monitoring
    description: Saved targets, schedules, history, maintenance, and notifications.
security: []
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check whether the API process is alive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      responses:
        "200":
          description: API is ready
        "503":
          description: PostgreSQL is unavailable
  /api/v1/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: Get available diagnostic checks and runtime limits
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Queue a diagnostic run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run queued
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Target blocked by network policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Run queue or database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List persisted diagnostic runs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Run history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
  /api/v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a diagnostic run and its results
      responses:
        "200":
          description: Diagnostic run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a queued or active run
      responses:
        "204":
          description: Cancellation accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run has already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream live run progress
      description: |
        Server-Sent Events stream. Event names are `run.started`,
        `check.started`, `check.completed`, `check.failed`, `run.completed`,
        and `run.cancelled`. REST and PostgreSQL remain the source of truth.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{id}/export:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - in: query
        name: format
        schema:
          type: string
          enum: [json, csv]
          default: json
    get:
      tags: [Runs]
      operationId: exportRun
      summary: Export a run as JSON or CSV
      responses:
        "200":
          description: JSON export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticRun"
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets:
    get:
      tags: [Monitoring]
      operationId: listTargets
      summary: List monitored targets
      responses:
        "200":
          description: Monitored target page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetPage"
    post:
      tags: [Monitoring]
      operationId: createTarget
      summary: Save and schedule a monitored target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/targets/{targetID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: getTarget
      summary: Get a monitored target
      responses:
        "200":
          description: Monitored target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Monitoring]
      operationId: updateTarget
      summary: Update target configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "200":
          description: Updated target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Monitoring]
      operationId: deleteTarget
      summary: Delete a monitored target and its history
      responses:
        "204":
          description: Target deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/pause:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      tags: [Monitoring]
      operationId: pauseTarget
      summary: Pause scheduled checks
      responses:
        "204":
          description: Target paused
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/resume:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      tags: [Monitoring]
      operationId: resumeTarget
      summary: Resume scheduled checks
      responses:
        "204":
          description: Target resumed and due immediately
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/checks:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listTargetChecks
      summary: List target status and latency history
      responses:
        "200":
          description: Monitoring check page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringCheckPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/maintenance:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listMaintenanceWindows
      summary: List target maintenance windows
      responses:
        "200":
          description: Maintenance windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceWindow"
    post:
      tags: [Monitoring]
      operationId: createMaintenanceWindow
      summary: Schedule a maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowInput"
      responses:
        "201":
          description: Maintenance window created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/targets/{targetID}/maintenance/{windowID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/WindowID"
    delete:
      tags: [Monitoring]
      operationId: deleteMaintenanceWindow
      summary: Delete a maintenance window
      responses:
        "204":
          description: Maintenance window deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/targets/{targetID}/notifications:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [Monitoring]
      operationId: listNotificationChannels
      summary: List target notification channels
      responses:
        "200":
          description: Notification channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
    post:
      tags: [Monitoring]
      operationId: createNotificationChannel
      summary: Add an email or webhook channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelInput"
      responses:
        "201":
          description: Notification channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/targets/{targetID}/notifications/{channelID}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
      - $ref: "#/components/parameters/ChannelID"
    delete:
      tags: [Monitoring]
      operationId: deleteNotificationChannel
      summary: Delete a notification channel
      responses:
        "204":
          description: Notification channel deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/monitoring:
    get:
      tags: [Monitoring]
      operationId: getMonitoringOverview
      summary: Get active-target counts and the operational journal
      responses:
        "200":
          description: Monitoring overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringOverview"
components:
  parameters:
    RunID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    TargetID:
      in: path
      name: targetID
      required: true
      schema:
        type: string
        format: uuid
    WindowID:
      in: path
      name: windowID
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      in: path
      name: channelID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid target, options, or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Diagnostic run not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: netscope
        version:
          type: string
    Capability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
    Capabilities:
      type: object
      required: [version, checks, runtime]
      properties:
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Capability"
        runtime:
          type: object
          required:
            [
              defaultTimeoutMs,
              maxTimeoutMs,
              runWorkers,
              probeConcurrency,
              networkPolicy,
            ]
          properties:
            defaultTimeoutMs:
              type: integer
            maxTimeoutMs:
              type: integer
            runWorkers:
              type: integer
            probeConcurrency:
              type: integer
            networkPolicy:
              type: string
              enum: [local, public]
    CheckType:
      type: string
      enum: [dns, tcp, http, tls, ping, traceroute]
    RunStatus:
      type: string
      enum:
        [queued, running, completed, partial, failed, cancelled, interrupted]
    CheckStatus:
      type: string
      enum: [pending, running, passed, warning, failed, skipped, cancelled]
    RunOptions:
      type: object
      required:
        [
          timeoutMs,
          httpMethod,
          followRedirects,
          maxRedirects,
          ipVersion,
          pingPackets,
          maxHops,
        ]
      properties:
        timeoutMs:
          type: integer
          minimum: 500
          maximum: 30000
          default: 5000
        tcpPorts:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
        httpMethod:
          type: string
          enum: [GET, HEAD]
          default: GET
        followRedirects:
          type: boolean
          default: true
        maxRedirects:
          type: integer
          minimum: 0
          maximum: 10
          default: 5
        ipVersion:
          type: string
          enum: [auto, ipv4, ipv6]
          default: auto
        pingPackets:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
        maxHops:
          type: integer
          minimum: 1
          maximum: 64
          default: 20
    CreateRunRequest:
      type: object
      required: [target, checks]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 2048
          examples: [example.com, "https://example.com", 1.1.1.1]
        checks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
    CreateRunResponse:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        createdAt:
          type: string
          format: date-time
    CheckResult:
      type: object
      required:
        [id, runId, type, status, durationMs, data, startedAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/CheckType"
        status:
          $ref: "#/components/schemas/CheckStatus"
        durationMs:
          type: integer
          format: int64
        summary:
          type: string
        data:
          oneOf:
            - $ref: "#/components/schemas/DNSResult"
            - $ref: "#/components/schemas/TCPResult"
            - $ref: "#/components/schemas/HTTPResult"
            - $ref: "#/components/schemas/TLSResult"
            - $ref: "#/components/schemas/PingResult"
            - $ref: "#/components/schemas/TracerouteResult"
            - type: object
              additionalProperties: true
        errorCode:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    DNSResult:
      type: object
      required: [a, aaaa, mx, ns, txt, ptr]
      properties:
        a:
          type: array
          items:
            type: string
            format: ipv4
        aaaa:
          type: array
          items:
            type: string
            format: ipv6
        cname:
          type: string
        mx:
          type: array
          items:
            type: object
            required: [host, preference]
            properties:
              host:
                type: string
              preference:
                type: integer
        ns:
          type: array
          items:
            type: string
        txt:
          type: array
          items:
            type: string
        ptr:
          type: array
          items:
            type: string
        errors:
          type: object
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    TCPResult:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          items:
            type: object
            required: [port, status, connectTimeMs]
            properties:
              port:
                type: integer
                minimum: 1
                maximum: 65535
              status:
                type: string
                enum: [passed, failed, cancelled]
              resolvedIp:
                type: string
              connectTimeMs:
                type: integer
                format: int64
              errorCode:
                type: string
              errorMessage:
                type: string
    HTTPResult:
      type: object
      required: [requestedUrl, method, redirectChain, timings, bodyTruncated]
      properties:
        requestedUrl:
          type: string
          format: uri
        finalUrl:
          type: string
          format: uri
        method:
          type: string
        statusCode:
          type: integer
        protocol:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
        redirectChain:
          type: array
          items:
            type: object
            required: [url, statusCode]
            properties:
              url:
                type: string
                format: uri
              statusCode:
                type: integer
        resolvedIp:
          type: string
        remoteAddress:
          type: string
        timings:
          type: object
          required: [dnsMs, connectMs, tlsMs, ttfbMs, totalMs]
          properties:
            dnsMs:
              type: integer
            connectMs:
              type: integer
            tlsMs:
              type: integer
            ttfbMs:
              type: integer
            totalMs:
              type: integer
        bodySha256:
          type: string
        bodyPreview:
          type: string
        bodyTruncated:
          type: boolean
    TLSResult:
      type: object
      required:
        [
          serverName,
          sans,
          daysRemaining,
          hostnameValid,
          chainValid,
          selfSigned,
          expired,
          warnings,
        ]
      properties:
        tlsVersion:
          type: string
        cipherSuite:
          type: string
        serverName:
          type: string
        resolvedIp:
          type: string
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        sans:
          type: array
          items:
            type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        daysRemaining:
          type: integer
        hostnameValid:
          type: boolean
        chainValid:
          type: boolean
        selfSigned:
          type: boolean
        expired:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    PingResult:
      type: object
      required:
        [
          address,
          packetsSent,
          packetsReceived,
          packetLossPercent,
          minRttMs,
          averageRttMs,
          maxRttMs,
          samples,
        ]
      properties:
        address:
          type: string
        packetsSent:
          type: integer
        packetsReceived:
          type: integer
        packetLossPercent:
          type: number
          minimum: 0
          maximum: 100
        minRttMs:
          type: number
        averageRttMs:
          type: number
        maxRttMs:
          type: number
        samples:
          type: array
          items:
            type: object
            required: [sequence, status]
            properties:
              sequence:
                type: integer
              status:
                type: string
                enum: [received, timeout]
              address:
                type: string
              rttMs:
                type: number
    TracerouteResult:
      type: object
      required: [address, reached, maxHops, hops]
      properties:
        address:
          type: string
        reached:
          type: boolean
        maxHops:
          type: integer
        hops:
          type: array
          items:
            type: object
            required: [number, status, destination]
            properties:
              number:
                type: integer
              status:
                type: string
                enum: [replied, timeout]
              address:
                type: string
              rttMs:
                type: number
              destination:
                type: boolean
    DiagnosticRun:
      type: object
      required:
        [
          id,
          target,
          normalizedHost,
          status,
          checks,
          options,
          results,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        target:
          type: string
        normalizedHost:
          type: string
        normalizedUrl:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/RunStatus"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
    RunPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticRun"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    TargetStatus:
      type: string
      enum: [pending, operational, warning, unavailable, paused, maintenance]
    TargetInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 2048
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            maxLength: 32
        checks:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CheckType"
        options:
          $ref: "#/components/schemas/RunOptions"
        intervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
        failureThreshold:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
    MonitoredTarget:
      allOf:
        - $ref: "#/components/schemas/TargetInput"
        - type: object
          required:
            [
              id,
              enabled,
              consecutiveFailures,
              status,
              nextCheckAt,
              createdAt,
              updatedAt,
            ]
          properties:
            id:
              type: string
              format: uuid
            enabled:
              type: boolean
            consecutiveFailures:
              type: integer
            status:
              $ref: "#/components/schemas/TargetStatus"
            lastCheckedAt:
              type: string
              format: date-time
            lastLatencyMs:
              type: integer
              format: int64
            tlsExpiresAt:
              type: string
              format: date-time
            nextCheckAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    TargetPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoredTarget"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    MonitoringCheck:
      type: object
      required: [id, targetId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TargetStatus"
        latencyMs:
          type: integer
          format: int64
        tlsExpiresAt:
          type: string
          format: date-time
        errorMessage:
          type: string
        checkedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MonitoringCheckPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringCheck"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    MaintenanceWindowInput:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
    MaintenanceWindow:
      allOf:
        - $ref: "#/components/schemas/MaintenanceWindowInput"
        - type: object
          required: [id, targetId, createdAt]
          properties:
            id:
              type: string
              format: uuid
            targetId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    NotificationChannelInput:
      type: object
      required: [kind, destination]
      properties:
        kind:
          type: string
          enum: [email, webhook]
        destination:
          type: string
    NotificationChannel:
      allOf:
        - $ref: "#/components/schemas/NotificationChannelInput"
        - type: object
          required: [id, targetId, enabled, createdAt]
          properties:
            id:
              type: string
              format: uuid
            targetId:
              type: string
              format: uuid
            enabled:
              type: boolean
            createdAt:
              type: string
              format: date-time
    MonitoringJournalEntry:
      allOf:
        - $ref: "#/components/schemas/MonitoringCheck"
        - type: object
          required: [targetName, targetAddress]
          properties:
            targetName:
              type: string
            targetAddress:
              type: string
    MonitoringOverview:
      type: object
      required:
        [activeTargets, warningTargets, unavailableTargets, recentChecks]
      properties:
        activeTargets:
          type: integer
          format: int64
        warningTargets:
          type: integer
          format: int64
        unavailableTargets:
          type: integer
          format: int64
        recentChecks:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringJournalEntry"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [invalid_target, run_not_found, target_blocked]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
